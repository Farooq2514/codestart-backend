spring.application.name=codestart-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coaching?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.centre-email=${CENTRE_EMAIL:codestart9989@gmail.com}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB